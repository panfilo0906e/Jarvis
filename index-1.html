<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04080d">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root {
  --bg: #04080d; --panel: #08131d; --line: #123a4f; --cyan: #3fd8ff; --cyan-dim: #1b6f8a;
  --amber: #ffb347; --fg: #d6f3ff; --muted: #6f93a6; --danger: #ff6b6b;
  --font-display: "Chakra Petch", "Trebuchet MS", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); background-image: radial-gradient(120% 60% at 50% 0%, #0a2433 0%, var(--bg) 60%);
  color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: max(8px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
.app { display: flex; flex-direction: column; gap: 10px; height: 100%; max-width: 720px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--font-display); font-weight: 600; letter-spacing: .32em; font-size: 15px; color: var(--cyan); }
.brand small { display: block; letter-spacing: .18em; font-weight: 400; font-size: 10px; color: var(--muted); margin-top: 1px; }
.top-r { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
button { font: inherit; color: inherit; }
.pill {
  font-family: var(--font-display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; color: var(--cyan); background: var(--panel);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.pill[data-s="thinking"] { color: var(--amber); } .pill[data-s="thinking"] i { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.pill[data-s="listening"] i { animation: blink 1s infinite; }
.pill[data-s="error"] { color: var(--danger); } .pill[data-s="error"] i { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
@keyframes blink { 50% { opacity: .25; } }
.tog { cursor: pointer; }
.tog[aria-pressed="false"] { color: var(--muted); } .tog[aria-pressed="false"] i { background: var(--muted); box-shadow: none; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.stage { flex: none; height: clamp(140px, 24vh, 230px); }
.stage canvas { width: 100%; height: 100%; display: block; }
.read { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.read div { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 5px 8px; min-width: 0; }
.read span { display: block; font-family: var(--font-display); font-size: 9px; letter-spacing: .18em; color: var(--muted); }
.read b { display: block; font-family: var(--font-display); font-weight: 500; font-size: 13px; color: var(--cyan); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.msg { max-width: 88%; padding: 9px 12px; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.ai { align-self: flex-start; border: 1px solid var(--line); border-left: 2px solid var(--cyan); background: var(--panel); }
.msg.me { align-self: flex-end; background: #0d2a3b; border: 1px solid var(--cyan-dim); }
.msg.sys { align-self: center; max-width: 100%; font-size: 12px; color: var(--muted); text-align: center; padding: 2px 8px; }
.msg.ai.thinking { color: var(--amber); font-family: var(--font-display); letter-spacing: .12em; font-size: 12px; }
.chips { flex: none; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; cursor: pointer; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.chip:hover { color: var(--cyan); border-color: var(--cyan-dim); }
.comp { flex: none; display: flex; gap: 6px; align-items: stretch; }
.comp input[type="text"] { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; color: var(--fg); font: inherit; padding: 11px 12px; }
.comp input::placeholder { color: var(--muted); }
input:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 0 1px var(--cyan); }
.btn { cursor: pointer; border: 1px solid var(--cyan-dim); background: #0b2434; color: var(--cyan); border-radius: 4px; padding: 0 14px; min-height: 44px; font-family: var(--font-display); letter-spacing: .12em; font-size: 12px; text-transform: uppercase; }
.btn:hover { background: #10344a; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.stop { color: var(--amber); border-color: var(--amber); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.mic { width: 48px; padding: 0; display: grid; place-items: center; }
.mic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.mic.on { color: var(--bg); background: var(--cyan); }
.ov { position: fixed; inset: 0; background: rgba(2, 6, 10, .86); display: grid; place-items: center; padding: 16px; z-index: 20; }
.ov[hidden] { display: none; }
.card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--cyan-dim); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: .2em; font-size: 14px; color: var(--cyan); }
.card p { margin: 0; font-size: 13px; color: var(--muted); }
.card label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-family: var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
.card input { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; color: var(--fg); font: 14px var(--font-body); padding: 10px; letter-spacing: 0; text-transform: none; }
.card { max-height: 100%; overflow-y: auto; }
.card select { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; color: var(--fg); font: 14px var(--font-body); padding: 10px; letter-spacing: 0; text-transform: none; width: 100%; }
.card input[type="range"] { padding: 0; accent-color: var(--cyan); width: 100%; }
.card .sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
.card .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 380px) { .read { grid-template-columns: repeat(2, 1fr); } .stage { height: 130px; } }
@media (prefers-reduced-motion: reduce) { .pill[data-s="listening"] i { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">J.A.R.V.I.S.<small>ASISTENTE PERSONAL</small></div>
    <div class="top-r">
      <button class="pill tog" id="voiceTog" aria-pressed="true" title="Respuestas por voz"><i></i>Voz</button>
      <button class="pill tog" id="cfgBtn" aria-pressed="true" title="Ajustes">Ajustes</button>
      <div class="pill" id="status" data-s="idle" role="status"><i></i><span id="statusTxt">En línea</span></div>
    </div>
  </div>

  <div class="stage"><canvas id="reactor" aria-hidden="true"></canvas></div>

  <div class="read" aria-label="Estado del sistema">
    <div><span>HORA</span><b id="rClock">--:--:--</b></div>
    <div><span>FECHA</span><b id="rDate">--</b></div>
    <div><span>MENSAJES</span><b id="rMsgs">0</b></div>
    <div><span>SESIÓN</span><b id="rUp">00:00</b></div>
  </div>

  <div class="log" id="log" aria-live="polite"></div>

  <div class="chips" id="chips">
    <button class="chip" data-q="Ponme al día: dime en qué puedes ayudarme hoy.">¿Qué puedes hacer?</button>
    <button class="chip" data-q="Organízame un plan de trabajo para esta tarde en 4 pasos.">Plan para hoy</button>
    <button class="chip" data-q="Dame una idea de proyecto para construir este fin de semana.">Idea de proyecto</button>
    <button class="chip" data-q="Cuéntame un chiste inteligente.">Un chiste</button>
  </div>

  <form class="comp" id="form" autocomplete="off">
    <button type="button" class="btn mic" id="mic" aria-label="Conversar por voz" aria-pressed="false" title="Conversar por voz" hidden>
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input id="text" type="text" placeholder="Hable o escriba…" aria-label="Mensaje" enterkeyhint="send">
    <button type="submit" class="btn" id="send">Enviar</button>
  </form>
</div>

<div class="ov" id="ov" hidden>
  <form class="card" id="cfg" autocomplete="off">
    <h2>AJUSTES</h2>
    <p>Use una clave gratuita de Google Gemini: créela en aistudio.google.com/apikey. Se guarda solo en este navegador. En la capa gratuita, Google puede usar sus conversaciones para mejorar sus productos.</p>
    <label>Clave de API de Google<input id="kKey" type="password" placeholder="AIza..." autocapitalize="off" spellcheck="false"></label>
    <label>Cómo debo llamarle<input id="kName" type="text" placeholder="jefe"></label>
    <label>Modelo<input id="kModel" type="text" placeholder="gemini-3.8-flash" autocapitalize="off" spellcheck="false"></label>
    <hr class="sep">
    <label>Voz<select id="kVoice"></select></label>
    <label><span>Velocidad <b id="vRate"></b></span><input id="kRate" type="range" min="0.7" max="1.4" step="0.05"></label>
    <label><span>Tono <b id="vPitch"></b></span><input id="kPitch" type="range" min="0.5" max="1.5" step="0.05"></label>
    <div class="row"><button type="button" class="btn ghost" id="kTest">Probar voz</button></div>
    <div class="row">
      <button type="button" class="btn ghost" id="kClear">Borrar clave</button>
      <button type="button" class="btn ghost" id="kClose">Cerrar</button>
      <button type="submit" class="btn">Guardar</button>
    </div>
  </form>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var log = $("log"), input = $("text"), sendBtn = $("send"), micBtn = $("mic"), form = $("form");
  var statusEl = $("status"), statusTxt = $("statusTxt"), voiceTog = $("voiceTog");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var apiKey = store.get("jarvis-gkey") || "";
  var userName = store.get("jarvis-name") || "jefe";
  var model = store.get("jarvis-gmodel") || "gemini-3.8-flash";
  var voiceOn = store.get("jarvis-voice") !== "off";

  var turns = [], busy = false, ctl = null, state = "idle", msgCount = 0, started = Date.now();
  var streaming = false, speaking = false, speakQ = [], convMode = false, listening = false, silent = 0, rec = null;

  var LABELS = { idle: "En línea", listening: "Escuchando", thinking: "Procesando", speaking: "Respondiendo", error: "Sin enlace" };
  function setState(s) { state = s; statusEl.dataset.s = s; statusTxt.textContent = LABELS[s] || s; }

  function addMsg(kind, text, thinking) {
    var d = document.createElement("div");
    d.className = "msg " + kind + (thinking ? " thinking" : "");
    d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    return d;
  }

  /* ---------- Ajustes ---------- */
  var ov = $("ov");
  function openCfg() { pickVoice(); fillVoices(); paintVoiceCfg(); $("kKey").value = apiKey; $("kName").value = userName; $("kModel").value = model; ov.hidden = false; $("kKey").focus(); }
  function closeCfg() { ov.hidden = true; }
  $("cfgBtn").onclick = openCfg;
  $("kClose").onclick = closeCfg;
  $("kClear").onclick = function () { apiKey = ""; store.del("jarvis-gkey"); $("kKey").value = ""; };
  $("cfg").addEventListener("submit", function (ev) {
    ev.preventDefault();
    apiKey = $("kKey").value.trim();
    userName = $("kName").value.trim() || "jefe";
    model = $("kModel").value.trim() || "gemini-3.8-flash";
    if (apiKey) store.set("jarvis-gkey", apiKey);
    store.set("jarvis-name", userName); store.set("jarvis-gmodel", model);
    closeCfg();
    addMsg("sys", apiKey ? "Ajustes guardados." : "Falta la clave de API.");
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !ov.hidden) closeCfg(); });

  /* ---------- Voz de salida ---------- */
  var synth = window.speechSynthesis || null, esVoice = null;
  var voiceName = store.get("jarvis-vname") || "";
  var vRate = parseFloat(store.get("jarvis-rate")) || 1.03;
  var vPitch = parseFloat(store.get("jarvis-pitch")) || 0.9;
  function pickVoice() {
    if (!synth) return;
    var vs = synth.getVoices() || [];
    esVoice = vs.find(function (v) { return voiceName && v.name === voiceName; }) ||
              vs.find(function (v) { return /^es[-_]MX/i.test(v.lang); }) || vs.find(function (v) { return /^es/i.test(v.lang); }) || null;
  }
  function fillVoices() {
    var sel = $("kVoice"); sel.innerHTML = "";
    var list = synth ? (synth.getVoices() || []).filter(function (v) { return /^es/i.test(v.lang); }) : [];
    if (!list.length) {
      var o0 = document.createElement("option"); o0.value = ""; o0.textContent = "Voz predeterminada del dispositivo"; sel.appendChild(o0); return;
    }
    list.forEach(function (v) {
      var o = document.createElement("option"); o.value = v.name; o.textContent = v.name + " (" + v.lang + ")";
      if (esVoice && v.name === esVoice.name) o.selected = true;
      sel.appendChild(o);
    });
  }
  function paintVoiceCfg() {
    $("kRate").value = vRate; $("kPitch").value = vPitch;
    $("vRate").textContent = vRate.toFixed(2) + "x"; $("vPitch").textContent = vPitch.toFixed(2);
  }
  function applyVoiceCfg() {
    voiceName = $("kVoice").value || "";
    vRate = parseFloat($("kRate").value) || 1; vPitch = parseFloat($("kPitch").value) || 1;
    store.set("jarvis-vname", voiceName); store.set("jarvis-rate", String(vRate)); store.set("jarvis-pitch", String(vPitch));
    pickVoice(); paintVoiceCfg();
  }
  ["change", "input"].forEach(function (n) {
    ["kVoice", "kRate", "kPitch"].forEach(function (id) { $(id).addEventListener(n, applyVoiceCfg); });
  });
  $("kTest").onclick = function () {
    if (!synth) { addMsg("sys", "Este navegador no puede reproducir voz."); return; }
    applyVoiceCfg(); stopSpeaking();
    var u = new SpeechSynthesisUtterance("Sistemas en línea. A sus órdenes, " + userName + ".");
    u.lang = esVoice ? esVoice.lang : "es-MX"; if (esVoice) u.voice = esVoice;
    u.rate = vRate; u.pitch = vPitch;
    try { synth.speak(u); } catch (e) {}
  };
  if (synth) { pickVoice(); if (synth.addEventListener) synth.addEventListener("voiceschanged", function () { pickVoice(); fillVoices(); }); }
  function paintVoice() { voiceTog.setAttribute("aria-pressed", String(voiceOn)); }
  paintVoice();
  voiceTog.onclick = function () {
    voiceOn = !voiceOn; paintVoice(); store.set("jarvis-voice", voiceOn ? "on" : "off");
    if (!voiceOn) stopSpeaking(); else enqueue("Voz activada.");
  };
  function clean(s) { return s.replace(/[*_#`>~]/g, "").replace(/\s+/g, " ").trim(); }
  function enqueue(s) {
    if (!synth || !voiceOn) return;
    s = clean(s); if (!s) return;
    speakQ.push(s); pump();
  }
  function pump() {
    if (speaking || !speakQ.length) return;
    speaking = true; setState("speaking");
    var u = new SpeechSynthesisUtterance(speakQ.shift());
    u.lang = esVoice ? esVoice.lang : "es-MX"; if (esVoice) u.voice = esVoice;
    u.rate = vRate; u.pitch = vPitch;
    var done = function () { speaking = false; if (speakQ.length) pump(); else maybeContinue(); };
    u.onend = done; u.onerror = done;
    try { synth.speak(u); } catch (e) { done(); }
  }
  function stopSpeaking() {
    speakQ = [];
    try { if (synth) synth.cancel(); } catch (e) {}
    speaking = false;
    if (state === "speaking") setState("idle");
  }
  function maybeContinue() {
    if (streaming || speaking || speakQ.length) return;
    if (state === "speaking") setState("idle");
    if (convMode) setTimeout(listen, 300);
  }

  /* ---------- Claude ---------- */
  function sysPrompt() {
    var now = new Date().toLocaleString("es-MX", { dateStyle: "full", timeStyle: "short" });
    return "Eres J.A.R.V.I.S., el asistente de inteligencia artificial personal al estilo del de Tony Stark: elegante, sereno, con ingenio seco y lealtad impecable. " +
      "Habla siempre en español y llama al usuario \"" + userName + "\". Tus respuestas se leen en voz alta: usa frases cortas y naturales (máximo 3 frases salvo que pidan más detalle), " +
      "sin markdown, sin listas con símbolos y sin emojis. Cuando sea útil, ofrece un siguiente paso. " +
      "Eres honesto: no puedes abrir apps, controlar dispositivos ni navegar por internet; si te lo piden, dilo con elegancia y ofrece lo que sí puedes hacer (planear, explicar, redactar, calcular, aconsejar). " +
      "Fecha y hora actuales del usuario: " + now + ".";
  }
  function history() {
    var h = turns.slice(-20);
    while (h.length && h[0].role !== "user") h.shift();
    return h;
  }
  async function ask(onDelta, signal) {
    var contents = history().map(function (t) {
      return { role: t.role === "assistant" ? "model" : "user", parts: [{ text: t.content }] };
    });
    var url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":streamGenerateContent?alt=sse";
    var res = await fetch(url, {
      method: "POST", signal: signal,
      headers: { "content-type": "application/json", "x-goog-api-key": apiKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: sysPrompt() }] },
        contents: contents,
        generationConfig: { maxOutputTokens: 1024, temperature: 0.8 }
      })
    });
    if (!res.ok) {
      var m = ""; try { var j = await res.json(); m = (j.error && j.error.message) || ""; } catch (e) {}
      throw { status: res.status, message: m };
    }
    var reader = res.body.getReader(), dec = new TextDecoder(), buf = "", full = "";
    while (true) {
      var r = await reader.read();
      if (r.done) break;
      buf += dec.decode(r.value, { stream: true });
      var i;
      while ((i = buf.indexOf("\n")) >= 0) {
        var line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (line.indexOf("data:") !== 0) continue;
        var d = line.slice(5).trim();
        if (!d || d === "[DONE]") continue;
        var ev = null;
        try { ev = JSON.parse(d); } catch (e) { continue; }
        if (ev.error) throw { status: ev.error.code || 0, message: ev.error.message };
        if (ev.promptFeedback && ev.promptFeedback.blockReason) throw { status: 0, message: "Solicitud bloqueada: " + ev.promptFeedback.blockReason };
        var parts = ev.candidates && ev.candidates[0] && ev.candidates[0].content && ev.candidates[0].content.parts;
        if (!parts) continue;
        for (var p = 0; p < parts.length; p++) {
          if (parts[p].thought || !parts[p].text) continue;
          full += parts[p].text; onDelta(parts[p].text, full);
        }
      }
    }
    if (!full) throw { status: 0, message: "Respuesta vacía" };
    return full;
  }

  function errCopy(e) {
    if (e && e.name === "AbortError") return "";
    var s = e && e.status, raw = (e && e.message) ? String(e.message) : "", m = raw ? " (" + raw.slice(0, 160) + ")" : "";
    if ((s === 400 || s === 401 || s === 403) && /api key|permission|unauthenticated|not valid/i.test(raw)) return "La clave de API no es válida o no tiene permiso. Revísela en Ajustes." + m;
    if (s === 404) return "No encontré el modelo. Cambie su nombre en Ajustes (por ejemplo gemini-3.6-flash)." + m;
    if (s === 429) return "Se alcanzó el límite gratuito por minuto o por día. Espere un momento; el límite diario se reinicia a medianoche, hora del Pacífico." + m;
    if (s === 400) return "La solicitud fue rechazada." + m;
    if (s >= 500) return "El servicio de Google no responde ahora. Reintente." + m;
    return "No pude conectarme. Revise su internet." + m;
  }

  async function send(raw) {
    var text = (raw || "").trim();
    if (!text || busy) return;
    if (!apiKey) { addMsg("sys", "Primero ingrese su clave de API."); openCfg(); return; }
    stopSpeaking();
    addMsg("me", text); msgCount++; paintReadouts();
    turns.push({ role: "user", content: text });
    input.value = "";
    busy = true; sendBtn.textContent = "Parar"; sendBtn.classList.add("stop");
    setState("thinking"); streaming = true;
    var bubble = addMsg("ai", "PROCESANDO…", true), pending = "", full = "";
    ctl = new AbortController();
    try {
      full = await ask(function (delta, whole) {
        bubble.classList.remove("thinking"); bubble.textContent = whole; log.scrollTop = log.scrollHeight;
        pending += delta;
        var m;
        while ((m = /[.!?…]+["')\]]*\s|\n/.exec(pending))) {
          var end = m.index + m[0].length;
          enqueue(pending.slice(0, end)); pending = pending.slice(end);
        }
      }, ctl.signal);
      if (pending.trim()) enqueue(pending);
      turns.push({ role: "assistant", content: full }); msgCount++; paintReadouts();
    } catch (e) {
      var partial = bubble.classList.contains("thinking") ? "" : bubble.textContent;
      if (partial) turns.push({ role: "assistant", content: partial }); else { turns.pop(); bubble.remove(); }
      speakQ = []; if (convMode) endConv();
      var c = errCopy(e);
      if (c) { addMsg("sys", c); setState("error"); setTimeout(function () { if (state === "error") setState("idle"); }, 4000); }
      else setState("idle");
    } finally {
      busy = false; ctl = null; streaming = false;
      sendBtn.textContent = "Enviar"; sendBtn.classList.remove("stop");
      if (state === "thinking") setState("idle");
      maybeContinue();
    }
  }
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (busy) { if (ctl) ctl.abort(); return; }
    send(input.value);
  });
  $("chips").addEventListener("click", function (ev) { var b = ev.target.closest(".chip"); if (b) send(b.dataset.q); });

  /* ---------- Voz de entrada y modo conversación ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function paintMic() {
    micBtn.classList.toggle("on", convMode); micBtn.setAttribute("aria-pressed", String(convMode));
    micBtn.title = convMode ? "Terminar conversación" : "Conversar por voz"; micBtn.setAttribute("aria-label", micBtn.title);
  }
  function endConv(msg) {
    convMode = false; paintMic();
    try { if (rec) rec.abort(); } catch (e) {}
    if (msg) addMsg("sys", msg);
    if (state === "listening") setState("idle");
  }
  function listen() {
    if (!SR || !convMode || busy || listening || speaking || speakQ.length) return;
    var finalText = "", heard = false;
    try {
      rec = new SR(); rec.lang = "es-MX"; rec.interimResults = true; rec.continuous = false;
      rec.onstart = function () { listening = true; setState("listening"); };
      rec.onresult = function (ev) {
        var t = "";
        for (var i = 0; i < ev.results.length; i++) { t += ev.results[i][0].transcript; if (ev.results[i].isFinal) finalText = t; }
        heard = true; input.value = t;
      };
      rec.onerror = function (ev) {
        if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
          endConv("El navegador bloqueó el micrófono. Permítalo en el candado de la barra de direcciones. En el teléfono, la página debe abrirse por https.");
        } else if (ev.error === "network") {
          endConv("El reconocimiento de voz necesita internet y falló. Reintente.");
        } else if (ev.error === "audio-capture") {
          endConv("No encuentro un micrófono conectado.");
        }
      };
      rec.onend = function () {
        listening = false;
        if (state === "listening") setState("idle");
        if (!convMode) return;
        var t = finalText.trim() || (heard ? input.value.trim() : "");
        if (t) { silent = 0; send(t); }
        else if (++silent >= 3) endConv("No escuché nada. Toque el micrófono cuando quiera continuar.");
        else setTimeout(listen, 250);
      };
      rec.start();
    } catch (e) { endConv("No pude iniciar el micrófono en este navegador."); }
  }
  if (SR) {
    micBtn.hidden = false;
    micBtn.onclick = function () {
      if (convMode) { endConv("Conversación terminada."); stopSpeaking(); if (ctl) ctl.abort(); return; }
      if (!apiKey) { openCfg(); return; }
      convMode = true; silent = 0; paintMic();
      if (!voiceOn) { voiceOn = true; paintVoice(); store.set("jarvis-voice", "on"); }
      stopSpeaking();
      addMsg("sys", "Modo conversación activo. Hable cuando quiera; toque el micrófono para terminar.");
      listen();
    };
  } else {
    addMsg("sys", "Este navegador no tiene reconocimiento de voz. Use Chrome o Edge para hablarle; mientras tanto puede escribir.");
  }

  /* ---------- Lecturas ---------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function paintReadouts() {
    var d = new Date();
    $("rClock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    $("rDate").textContent = d.toLocaleDateString("es-MX", { day: "2-digit", month: "short" }).replace(".", "");
    $("rMsgs").textContent = String(msgCount);
    var s = Math.floor((Date.now() - started) / 1000);
    $("rUp").textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60);
  }
  paintReadouts(); setInterval(paintReadouts, 1000);

  /* ---------- Reactor ---------- */
  var cv = $("reactor"), cx2 = cv.getContext("2d"), W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = cv.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
    cx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize(); window.addEventListener("resize", resize);
  var CY = "#3fd8ff", AM = "#ffb347", rot = 0, level = 0;
  function arc(x, y, r, a0, a1, w, col, alpha) { cx2.beginPath(); cx2.arc(x, y, r, a0, a1); cx2.lineWidth = w; cx2.strokeStyle = col; cx2.globalAlpha = alpha; cx2.stroke(); }
  function frame(t) {
    cx2.clearRect(0, 0, W, H);
    var x = W / 2, y = H / 2, R = Math.min(W, H) / 2 - 4, th = Math.PI * 2;
    var speed = (state === "thinking" ? 2.4 : state === "listening" ? 1.3 : state === "speaking" ? 1.6 : 0.5) * (reduce ? 0.12 : 1);
    var target = state === "speaking" ? 0.5 + 0.5 * Math.abs(Math.sin(t / 130) * Math.sin(t / 310)) :
                 state === "listening" ? 0.45 + 0.2 * Math.sin(t / 220) :
                 state === "thinking" ? 0.7 : 0.18 + 0.08 * Math.sin(t / 900);
    level += (target - level) * 0.12; rot += 0.012 * speed;
    var col = state === "thinking" ? AM : CY;
    var g = cx2.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, col); g.addColorStop(0.18 + level * 0.12, col); g.addColorStop(1, "rgba(0,0,0,0)");
    cx2.globalAlpha = 0.10 + level * 0.28; cx2.fillStyle = g; cx2.beginPath(); cx2.arc(x, y, R, 0, th); cx2.fill();
    cx2.setLineDash([2, 7]); arc(x, y, R, rot * -0.6, rot * -0.6 + th, 1.5, CY, 0.55); cx2.setLineDash([]);
    for (var i = 0; i < 3; i++) arc(x, y, R * 0.86, rot + i * (th / 3), rot + i * (th / 3) + 1.35, 3, col, 0.9);
    arc(x, y, R * 0.86, 0, th, 1, CY, 0.18);
    for (var k = 0; k < 24; k++) {
      var a = -rot * 1.4 + k * (th / 24), on = (k / 24) < level + 0.2;
      var r0 = R * 0.64, r1 = R * (0.7 + (on ? 0.07 * level : 0));
      cx2.beginPath(); cx2.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); cx2.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
      cx2.lineWidth = 2; cx2.strokeStyle = on ? col : CY; cx2.globalAlpha = on ? 0.95 : 0.25; cx2.stroke();
    }
    arc(x, y, R * 0.5, 0, th, 2, CY, 0.7);
    for (var j = 0; j < 8; j++) { var b = rot * 0.8 + j * (th / 8); arc(x, y, R * 0.42, b, b + 0.4, 5, col, 0.8); }
    var core = R * (0.2 + level * 0.07);
    var cg = cx2.createRadialGradient(x, y, 0, x, y, core * 1.8);
    cg.addColorStop(0, "#ffffff"); cg.addColorStop(0.35, col); cg.addColorStop(1, "rgba(0,0,0,0)");
    cx2.globalAlpha = 1; cx2.fillStyle = cg; cx2.beginPath(); cx2.arc(x, y, core * 1.8, 0, th); cx2.fill();
    arc(x, y, core, 0, th, 2, "#ffffff", 0.9);
    cx2.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- Inicio ---------- */
  addMsg("ai", "Sistemas en línea. ¿En qué puedo ayudarle, " + userName + "?");
  if (!apiKey) { addMsg("sys", "Para empezar, ingrese su clave de API en Ajustes."); openCfg(); }
})();
</script>
</body>
